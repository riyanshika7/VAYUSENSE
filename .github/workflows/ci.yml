name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Pytest (Full Sync + Asyncio Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full pytest suite (including asyncio/ASGI tests)
        env:
          ENVIRONMENT: development
          WAQI_API_TOKEN: ""
          GEMINI_API_KEY: ""
        run: pytest -v

  frontend:
    name: Frontend Tests, Contrast Guard & Strict Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Run unit, concurrency & accessibility suites
        run: npm --prefix frontend test
      - name: Run WCAG contrast regression check
        run: node frontend/tests/contrast.mjs
      - name: Run TypeScript strict compiler & production build
        run: |
          node frontend/node_modules/typescript/bin/tsc -p frontend/tsconfig.json --noEmit
          npm --prefix frontend run build
